version: 2
updates:
  - package-ecosystem: cargo
    schedule:
      interval: weekly
      time: "06:00"
      timezone: Africa/Johannesburg
      day: monday
    directory: /src-tauri
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
  - package-ecosystem: github-actions
    schedule:
      interval: weekly
      time: "06:00"
      timezone: Africa/Johannesburg
      day: monday
    directory: /
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
  - package-ecosystem: npm
    schedule:
      interval: weekly
      time: "06:00"
      timezone: Africa/Johannesburg
      day: monday
    directory: /
    open-pull-requests-limit: 5
    groups:
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
